# Libros recomendados por tema para cada video del canal.
# Cada video recibe los libros de los temas cuyas palabras aparecen en su título
# (sin tildes ni mayúsculas), en este orden, hasta 4 libros. Página: /v/<id>/
# Para añadir un tema nuevo: copia un bloque y cambia palabras y libros.
