name: Publicar web

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *"   # cada día: trae los videos nuevos de YouTube
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 markdown pyyaml
      - name: Sincronizar videos de YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/sync_youtube.py
      - name: Guardar lista de videos
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "web-bot"
            git config user.email "web-bot@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Actualizar videos de YouTube"
            git push
          fi
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
