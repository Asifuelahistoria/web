- slug: omar-torrijos
  nombre: Omar Torrijos
  pais: Panamá
  poder: "1968–1981"
  anios_poder: 13
  muerte: "1981-07-31"
  lugar: "Cerro Marta, Coclé, Panamá"
  edad: 52
  final: accidente
  sello: "Avión siniestrado"
  resumen: "Gobernó Panamá sin elecciones y negoció la devolución del Canal. Murió cuando su avioneta se estrelló en 1981, una muerte que sigue rodeada de sospechas."
  episodios: [asi-murieron-los-dictadores-parte-3]
  cuerpo: |
    ## El poder

    En 1968, Omar Torrijos tomó el poder en Panamá tras el golpe militar que derrocó al presidente Arnulfo Arias. No fue un dictador clásico de puño de hierro, pero gobernó sin elecciones, controló la prensa y concentró el poder en la Guardia Nacional. Su gran logro fueron los Tratados Torrijos–Carter de 1977, que devolvieron el Canal de Panamá a manos panameñas en el año 2000.

    ## El vuelo del 31 de julio de 1981

    Torrijos despegó en una avioneta desde Penonomé rumbo a Coclesito, su lugar de descanso. Nunca llegó. El avión se estrelló contra las montañas de Cerro Marta. La versión oficial habló de mal tiempo y error humano.

    ## Las sospechas

    Desde entonces su muerte ha alimentado teorías: un atentado de la CIA, un ajuste de cuentas dentro de las Fuerzas Armadas o una maniobra de su hombre de confianza, Manuel Antonio Noriega, que después ocupó el vacío de poder. Ninguna se ha probado. Tenía 52 años.

- slug: francisco-franco
  nombre: Francisco Franco
  apodo: "El Caudillo"
  pais: España
  poder: "1939–1975"
  anios_poder: 36
  muerte: "1975-11-20"
  lugar: "Hospital La Paz, Madrid"
  edad: 82
  final: cama
  sello: "Murió en el poder"
  resumen: "Ganó la Guerra Civil y gobernó España 36 años. Murió en el poder tras semanas de agonía y fue enterrado en el Valle de los Caídos."
  episodios: [asi-murieron-los-dictadores-parte-3]
  cuerpo: |
    ## El poder

    Francisco Franco tomó el poder en España tras la Guerra Civil de 1936 a 1939, con el apoyo de Hitler y Mussolini. Fue jefe del Estado, del ejército y del partido único. Su régimen se sostuvo con censura, presos políticos y fusilamientos. Durante la Segunda Guerra Mundial mantuvo una neutralidad calculada que le permitió sobrevivir a la caída de sus aliados.

    En 1969 designó como sucesor a Juan Carlos de Borbón.

    ## La agonía

    En octubre de 1975 sufrió una grave hemorragia digestiva y una cadena de complicaciones. Durante semanas fue mantenido con vida con operaciones y soporte artificial, mientras España seguía los partes médicos día a día.

    ## El final

    Murió el 20 de noviembre de 1975 en el Hospital La Paz de Madrid, a los 82 años. Recibió honores de jefe de Estado y fue enterrado en el Valle de los Caídos, un monumento construido en parte con trabajo de presos políticos. En 2019 sus restos fueron exhumados y trasladados al cementerio de Mingorrubio.

- slug: hugo-chavez
  nombre: Hugo Chávez
  pais: Venezuela
  poder: "1999–2013"
  anios_poder: 14
  muerte: "2013-03-05"
  lugar: "Caracas, Venezuela"
  edad: 58
  final: cama
  sello: "Murió en el poder"
  resumen: "Llegó al poder por las urnas tras un golpe fallido y gobernó 14 años. Murió en 2013 en medio de un hermetismo total sobre su enfermedad."
  episodios: [asi-murieron-los-dictadores-parte-3]
  cuerpo: |
    ## El poder

    Hugo Chávez apareció en la escena pública el 4 de febrero de 1992, al frente de un golpe fallido contra Carlos Andrés Pérez. Pasó dos años en prisión, fue indultado y en 1998 ganó la presidencia. Con la Constitución de 1999 amplió el poder presidencial y, con los años, su control sobre el Congreso, la justicia y la economía petrolera. Para sus seguidores fue la voz de los pobres. Para sus críticos, el gobernante que vació las instituciones democráticas.

    ## La enfermedad

    En 2011 anunció que tenía cáncer. Gran parte de su tratamiento se hizo en Cuba, bajo un hermetismo absoluto. El 8 de diciembre de 2012, en su último discurso, pidió a los venezolanos que votaran por Nicolás Maduro si a él le pasaba algo.

    ## El final

    El 5 de marzo de 2013 el gobierno anunció su muerte en Caracas. Tenía 58 años. Nunca se informó el tipo exacto de cáncer. Fue velado durante días con honores militares, ante un país dividido.

- slug: hector-bienvenido-trujillo
  nombre: Héctor Bienvenido Trujillo
  apodo: "Negro"
  pais: República Dominicana
  poder: "1952–1960"
  anios_poder: 8
  muerte: "2002-10-19"
  lugar: "Miami, Estados Unidos"
  edad: 94
  final: exilio
  sello: "Presidente de fachada"
  resumen: "Hermano menor de Trujillo, fue presidente de la República Dominicana durante ocho años sin tomar una decisión propia. Murió olvidado en Miami."
  episodios: [asi-murieron-los-dictadores-parte-3]
  cuerpo: |
    ## El presidente que nunca mandó

    En 1952, para aparentar una democracia, Rafael Leónidas Trujillo colocó en la presidencia a su hermano menor, Héctor Bienvenido. Era general, disciplinado, callado y absolutamente leal. Todas las decisiones seguían pasando por "El Jefe".

    ## La salida

    En 1960, con la presión internacional en aumento contra el régimen, Héctor dejó la presidencia y lo sustituyó Joaquín Balaguer. Tras el asesinato de su hermano en 1961, la familia salió del país.

    ## El final

    Vivió sus últimos años lejos de la política, en Miami. Murió en 2002, casi olvidado incluso en su país. Fue un presidente sin una sola decisión propia que recordar.

- slug: tiburcio-carias-andino
  nombre: Tiburcio Carías Andino
  pais: Honduras
  poder: "1933–1949"
  anios_poder: 16
  muerte: "1969-12-23"
  lugar: "Tegucigalpa, Honduras"
  edad: 93
  final: cama
  sello: "Murió en su cama"
  resumen: "Gobernó Honduras 16 años, reformó la Constitución para seguir en el cargo y se retiró sin ser derrocado. Murió en su casa décadas después."
  episodios: [asi-murieron-los-dictadores-parte-3]
  cuerpo: |
    ## El poder

    Tiburcio Carías Andino asumió la presidencia de Honduras en 1933 en medio de una crisis política y económica. Prometió orden y terminó instalando una de las dictaduras más largas de Centroamérica. Modificó la Constitución para extender su mandato, persiguió y exilió a líderes liberales, encarceló a críticos y censuró la prensa.

    La estabilidad de esos años se apoyó en acuerdos con las compañías bananeras estadounidenses.

    ## La salida

    En 1949, ante presiones internas y externas, dejó el poder sin ser derrocado y se retiró a la vida privada, protegido por un país moldeado a su imagen.

    ## El final

    Murió en diciembre de 1969 en Tegucigalpa. Sin juicios, sin exilio, sin persecución. Para sus seguidores, el hombre que dio paz a Honduras. Para sus detractores, el símbolo de un país congelado en el autoritarismo.

- slug: porfirio-diaz
  nombre: Porfirio Díaz
  pais: México
  poder: "1876–1911"
  anios_poder: 35
  muerte: "1915-07-02"
  lugar: "París, Francia"
  edad: 84
  final: exilio
  sello: "Murió en el exilio"
  resumen: "Llegó al poder con el lema de la no reelección y se quedó 35 años. La Revolución Mexicana lo expulsó y murió en París, donde siguen sus restos."
  episodios: [asi-murieron-los-dictadores-parte-3]
  cuerpo: |
    ## El Porfiriato

    Porfirio Díaz, general oaxaqueño y héroe de la lucha contra la intervención francesa, llegó al poder en 1876 bajo un lema: "Sufragio efectivo, no reelección". Lo cumplió solo al principio. Después reformó la Constitución, manipuló elecciones y se mantuvo en el poder durante más de tres décadas.

    México se modernizó con ferrocarriles e inversión extranjera, pero también vivió represión de huelgas, despojo de tierras indígenas y campesinas, y una desigualdad que alimentó la revolución.

    ## La caída

    En 1910 anunció una nueva reelección. Francisco I. Madero y otros líderes convirtieron ese anuncio en la Revolución Mexicana. Acorralado, Díaz renunció en mayo de 1911 y partió al exilio en Francia.

    ## El final

    Murió en París el 2 de julio de 1915, a los 84 años. Fue enterrado en el cementerio de Montparnasse. Sus restos nunca han regresado a México.

- slug: leon-febres-cordero
  nombre: León Febres-Cordero
  pais: Ecuador
  poder: "1984–1988"
  anios_poder: 4
  muerte: "2008-12-15"
  lugar: "Guayaquil, Ecuador"
  edad: 77
  final: cama
  sello: "Murió en su casa"
  resumen: "Presidente electo de Ecuador, su gobierno fue acusado de torturas y desapariciones. Fue secuestrado por sus propios militares en 1987."
  episodios: [asi-murieron-los-dictadores-parte-3]
  cuerpo: |
    ## El poder

    León Febres-Cordero, empresario guayaquileño, ganó la presidencia de Ecuador en 1984 con un discurso de mano dura. Organizaciones de derechos humanos acusaron a su gobierno de torturas, desapariciones y ejecuciones en la lucha contra la guerrilla Alfaro Vive Carajo.

    ## El presidente secuestrado

    En enero de 1987 vivió un episodio insólito: un grupo de comandos de la Fuerza Aérea lo secuestró en la base de Taura para exigir la liberación de un general encarcelado. Fue liberado tras aceptar el acuerdo. El hecho mostró que ni el presidente controlaba por completo a las fuerzas armadas.

    ## El final

    Tras dejar la presidencia en 1988 fue alcalde de Guayaquil durante dos periodos. Murió en Guayaquil el 15 de diciembre de 2008, a los 77 años, tras una larga enfermedad. Su figura sigue dividiendo a los ecuatorianos.

- slug: ramfis-trujillo
  nombre: Ramfis Trujillo
  pais: República Dominicana
  poder: "Hijo del dictador"
  anios_poder: 0
  muerte: "1969-12-28"
  lugar: "Madrid, España"
  edad: 40
  final: accidente
  sello: "Accidente de tránsito"
  resumen: "Coronel a los cuatro años, vengó a su padre con torturas y ejecuciones. Huyó a Europa con la fortuna familiar y murió tras un choque en Madrid."
  episodios: [asi-murieron-los-hijos-de-los-dictadores]
  cuerpo: |
    ## El heredero

    Rafael "Ramfis" Trujillo Martínez era hijo de Rafael Leónidas Trujillo. A los cuatro años ya era coronel del ejército dominicano y a los veintiséis, general de brigada. Cada grado militar fue un regalo de su padre.

    ## La venganza

    Ramfis estaba en París cuando su padre fue asesinado, el 30 de mayo de 1961. Regresó y dirigió personalmente la persecución de los conspiradores. Varios fueron capturados, torturados durante días y ejecutados sin juicio.

    En noviembre de 1961, presionado por Estados Unidos, salió del país con su familia y con una parte enorme de la fortuna acumulada en tres décadas: dinero, joyas, obras de arte. En Europa vivió como un playboy entre París y Madrid.

    ## El final

    El 17 de diciembre de 1969, en una carretera cerca de Madrid, el auto de Ramfis chocó contra otro vehículo. Murió días después, el 28 de diciembre, a los 40 años. Nunca fue juzgado por las torturas y ejecuciones que ordenó.

- slug: jean-claude-duvalier
  nombre: Jean-Claude Duvalier
  apodo: "Baby Doc"
  pais: Haití
  poder: "1971–1986"
  anios_poder: 15
  muerte: "2014-10-04"
  lugar: "Puerto Príncipe, Haití"
  edad: 63
  final: preso
  sello: "Murió procesado, sin condena"
  resumen: "Heredó Haití a los 19 años. Huyó en 1986, volvió por su cuenta en 2011, fue procesado y murió de un infarto antes de la sentencia."
  episodios: [asi-murieron-los-hijos-de-los-dictadores]
  cuerpo: |
    ## El heredero de Papa Doc

    François "Papa Doc" Duvalier gobernó Haití desde 1957 con los Tonton Macoute, una milicia que vestía de civil, con lentes oscuros, y mataba con total impunidad. Al morir en 1971 entregó el poder a su hijo Jean-Claude, de 19 años. El mundo lo conoció como "Baby Doc".

    ## El régimen y la huida

    Durante 15 años mantuvo el aparato de terror de su padre mientras el país se hundía en la pobreza. En 1980 celebró una boda que costó millones de dólares. En 1986, una revuelta popular y la retirada del apoyo de Estados Unidos lo obligaron a huir a Francia, con una fortuna que se calcula en cientos de millones.

    ## El regreso y el final

    En enero de 2011, tras 25 años de exilio, volvió a Haití por voluntad propia. Fue acusado de corrupción y de crímenes contra la humanidad, y por primera vez víctimas de su régimen declararon frente a él. El proceso avanzó lentamente. El 4 de octubre de 2014 murió de un infarto en Puerto Príncipe, a los 63 años, sin sentencia.
