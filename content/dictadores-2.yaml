- slug: manuel-antonio-noriega
  nombre: Manuel Antonio Noriega
  apodo: "El Hombre Fuerte de Panamá"
  pais: Panamá
  poder: "1983–1989"
  anios_poder: 6
  muerte: "2017-05-29"
  lugar: "Ciudad de Panamá"
  edad: 83
  final: preso
  sello: "Murió bajo custodia"
  resumen: "Fue aliado de la CIA y socio del narcotráfico. Estados Unidos invadió Panamá para capturarlo y pasó el resto de su vida en cárceles de tres países."
  episodios: [asi-murieron-los-dictadores-que-desafiaron-a-estados-unidos]
  cuerpo: |
    ## El doble juego

    Manuel Antonio Noriega fue jefe de inteligencia y luego el hombre fuerte de Panamá. Durante años fue útil para Washington: entregaba información en plena Guerra Fría. Al mismo tiempo traficaba armas y drogas con los carteles latinoamericanos.

    ## La invasión

    En 1989 el doble juego se rompió. El 20 de diciembre, Estados Unidos lanzó la Operación Causa Justa con más de 20.000 soldados. Noriega se refugió en la Nunciatura del Vaticano en Ciudad de Panamá. Las tropas estadounidenses la rodearon con altavoces que tocaban rock a todo volumen para presionarlo. El 3 de enero de 1990 se entregó.

    ## El final

    Fue juzgado y encarcelado en Estados Unidos, luego en Francia y finalmente en Panamá. Murió el 29 de mayo de 2017 en un hospital de Ciudad de Panamá, a los 83 años, todavía bajo custodia. El hombre que creyó manejar a la CIA terminó como su prisionero.

- slug: saddam-hussein
  nombre: Saddam Hussein
  pais: Irak
  poder: "1979–2003"
  anios_poder: 24
  muerte: "2006-12-30"
  lugar: "Bagdad, Irak"
  edad: 69
  final: ejecutado
  sello: "Ejecutado"
  resumen: "Gobernó Irak 24 años. Tras la invasión de 2003 fue hallado escondido en un agujero, juzgado y ahorcado en Bagdad."
  episodios: [asi-murieron-los-dictadores-que-desafiaron-a-estados-unidos]
  cuerpo: |
    ## El poder

    Saddam Hussein gobernó Irak con mano de hierro desde 1979. Su imagen estaba en murales, estatuas y billetes. Su régimen practicó purgas, torturas y desapariciones, y la guerra contra Irán dejó cientos de miles de muertos. En 1990 invadió Kuwait y se enfrentó a una coalición internacional encabezada por Estados Unidos.

    ## La caída

    En marzo de 2003 Estados Unidos invadió Irak. Bagdad cayó en semanas y Saddam huyó. El 13 de diciembre de 2003 fue encontrado escondido en un agujero cerca de Tikrit, su región natal, barbudo y desaliñado.

    ## El final

    Un tribunal iraquí lo condenó a muerte por crímenes contra la humanidad. En la madrugada del 30 de diciembre de 2006 fue ahorcado en Bagdad. Tenía 69 años. Las imágenes de su ejecución, grabadas con un teléfono, dieron la vuelta al mundo.

- slug: muamar-el-gadafi
  nombre: Muamar el Gadafi
  apodo: "El Guía de la Revolución"
  pais: Libia
  poder: "1969–2011"
  anios_poder: 42
  muerte: "2011-10-20"
  lugar: "Sirte, Libia"
  edad: 69
  final: asesinado
  sello: "Linchado"
  resumen: "Gobernó Libia 42 años. En 2011, huyendo de Sirte, su convoy fue atacado desde el aire y los rebeldes lo capturaron y lo mataron."
  episodios: [asi-murieron-los-dictadores-que-desafiaron-a-estados-unidos]
  cuerpo: |
    ## El poder

    Muamar el Gadafi tomó el poder en Libia con un golpe en 1969 y gobernó durante 42 años. Se hacía llamar "Guía de la Revolución" y "Rey de Reyes de África". Combinó la riqueza del petróleo, la represión y un culto a la personalidad sin límites. En el exterior financió guerrillas y atentados.

    ## 2011

    La Primavera Árabe llegó a Libia en febrero de 2011. El régimen respondió con fuerza contra los manifestantes y el país entró en guerra civil. La ONU aprobó una zona de exclusión aérea y la OTAN bombardeó las fuerzas del régimen.

    ## El 20 de octubre

    Gadafi intentaba huir de Sirte, su ciudad natal, en un convoy que fue atacado desde el aire por aviones de la OTAN. Herido, se escondió en una tubería de desagüe. Allí lo encontraron los rebeldes. Fue golpeado, humillado y asesinado frente a las cámaras de los teléfonos. No hubo juicio. Tenía 69 años.

- slug: slobodan-milosevic
  nombre: Slobodan Milošević
  apodo: "El carnicero de los Balcanes"
  pais: Serbia y Yugoslavia
  poder: "1989–2000"
  anios_poder: 11
  muerte: "2006-03-11"
  lugar: "Centro de detención de La Haya, Países Bajos"
  edad: 64
  final: preso
  sello: "Murió en su celda"
  resumen: "Presidente de Serbia y de Yugoslavia durante las guerras de los Balcanes. Fue el primer exjefe de Estado juzgado en La Haya y murió antes de la sentencia."
  episodios: [asi-murieron-los-dictadores-que-desafiaron-a-estados-unidos]
  cuerpo: |
    ## El poder

    Slobodan Milošević fue presidente de Serbia y luego de la Federación Yugoslava. En los años noventa, mientras Yugoslavia se desintegraba, impulsó el proyecto de una "Gran Serbia". Las guerras de Croacia, Bosnia y Kosovo dejaron limpiezas étnicas, campos de detención y matanzas de civiles.

    ## La caída

    En 1999 la OTAN bombardeó Yugoslavia por la guerra de Kosovo. En octubre de 2000, protestas masivas lo obligaron a reconocer su derrota electoral. En 2001 fue arrestado y entregado al Tribunal Penal Internacional para la ex Yugoslavia, en La Haya. Fue el primer exjefe de Estado juzgado por crímenes de guerra y genocidio ante un tribunal internacional.

    ## El final

    El juicio se alargó durante años. El 11 de marzo de 2006, Milošević fue encontrado muerto en su celda. La causa oficial fue un infarto. Tenía 64 años y nunca escuchó una sentencia.

- slug: robert-mugabe
  nombre: Robert Mugabe
  pais: Zimbabue
  poder: "1980–2017"
  anios_poder: 37
  muerte: "2019-09-06"
  lugar: "Singapur"
  edad: 95
  final: exilio
  sello: "Derrocado por los suyos"
  resumen: "Héroe de la independencia de Zimbabue, gobernó 37 años. Sus propios generales lo obligaron a renunciar en 2017 y murió en un hospital de Singapur."
  episodios: [asi-murieron-los-dictadores-que-desafiaron-a-estados-unidos]
  cuerpo: |
    ## Del libertador al tirano

    En 1980 Robert Mugabe llegó al poder como el héroe de la independencia de Zimbabue. Con los años convirtió la democracia en una fachada: elecciones manipuladas, persecución de la oposición y violencia política. La expropiación forzosa de tierras sin un plan productivo hundió la economía. El país sufrió hambre e hiperinflación.

    Estados Unidos y la Unión Europea lo cercaron con sanciones durante casi dos décadas.

    ## Noviembre de 2017

    A los 93 años, Mugabe preparaba su sucesión y su esposa Grace aparecía como heredera. El ejército, su sostén de siempre, dijo basta. Los tanques ocuparon Harare y sus propios generales lo obligaron a renunciar sin disparar un tiro.

    ## El final

    Murió el 6 de septiembre de 2019 en un hospital de Singapur, donde recibía tratamiento médico. Tenía 95 años. El hombre que prometió liberar su tierra terminó sus días lejos de ella.

- slug: nicolae-ceausescu
  nombre: Nicolae Ceaușescu
  apodo: "El Conducător"
  pais: Rumania
  poder: "1965–1989"
  anios_poder: 24
  muerte: "1989-12-25"
  lugar: "Târgoviște, Rumania"
  edad: 71
  final: ejecutado
  sello: "Fusilado"
  resumen: "Washington lo cortejó como el comunista rebelde de Europa del Este. En diciembre de 1989 fue juzgado en horas y fusilado junto a su esposa Elena."
  episodios: [asi-murieron-los-dictadores-que-desafiaron-a-estados-unidos]
  cuerpo: |
    ## El comunista que cortejó a Occidente

    En 1968 Nicolae Ceaușescu condenó la invasión soviética de Checoslovaquia. Estados Unidos vio en él una cuña dentro del bloque soviético: le dio beneficios comerciales y lo recibió en la Casa Blanca en 1978.

    Detrás de la diplomacia había un régimen brutal. Los rumanos sobrevivían con racionamiento y apagones mientras Ceaușescu levantaba palacios descomunales y alimentaba, junto a su esposa Elena, un culto a la personalidad enfermizo. En los años ochenta Washington le retiró su apoyo.

    ## Diciembre de 1989

    Las protestas estallaron en Timișoara y llegaron a Bucarest. El 21 de diciembre, durante un discurso desde el balcón del Comité Central, la multitud empezó a abuchearlo en directo. Al día siguiente huyó en helicóptero y fue capturado.

    ## El final

    El 25 de diciembre de 1989, tras un juicio sumario de pocas horas en Târgoviște, Nicolae y Elena Ceaușescu fueron fusilados. Él tenía 71 años. La ejecución fue filmada y emitida por televisión.
