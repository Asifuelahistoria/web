- slug: rafael-leonidas-trujillo
  nombre: Rafael Leónidas Trujillo
  apodo: "El Jefe"
  pais: República Dominicana
  poder: "1930–1961"
  anios_poder: 31
  muerte: "1961-05-30"
  lugar: "Carretera a San Cristóbal, República Dominicana"
  edad: 69
  final: asesinado
  sello: "Emboscado"
  resumen: "Gobernó la República Dominicana durante 31 años y murió acribillado en una carretera por hombres que habían servido a su régimen."
  episodios: [asi-murieron-los-dictadores-america-latina, como-murieron-los-dictadores-2026]
  cuerpo: |
    ## El poder

    Desde 1930, Rafael Leónidas Trujillo convirtió a la República Dominicana en una extensión de su persona. La capital pasó a llamarse Ciudad Trujillo, su retrato era obligatorio en las casas y el lema oficial del régimen era "Dios y Trujillo". Su servicio de inteligencia, el SIM, vigilaba conversaciones, cartas y rumores. Criticarlo, incluso en privado, podía terminar en La Cuarenta, uno de los centros de tortura más temidos del país.

    En 1937 ordenó la Matanza del Perejil, en la que miles de haitianos fueron asesinados en la frontera en pocos días.

    ## La noche del 30 de mayo de 1961

    Trujillo viajaba en su Chevrolet Bel Air por la carretera que unía la capital con San Cristóbal, sin escolta, como tantas otras noches. Lo esperaba un grupo de conspiradores. Muchos habían sido colaboradores, militares y funcionarios del propio régimen.

    Cuando el auto apareció, comenzó la emboscada. Trujillo intentó responder con su arma, pero cayó sobre el asfalto bajo una lluvia de balas. Tenía 69 años.

    ## Lo que vino después

    Su hijo Ramfis regresó de París y encabezó una cacería brutal contra los conspiradores. Pocos meses después la familia abandonó el país. Las estatuas cayeron y la capital volvió a llamarse Santo Domingo.

    El hombre que se creía intocable murió en una carretera oscura, abatido por quienes alguna vez lo habían protegido.

- slug: anastasio-somoza-debayle
  nombre: Anastasio Somoza Debayle
  apodo: "Tachito"
  pais: Nicaragua
  poder: "1967–1972 y 1974–1979"
  anios_poder: 10
  muerte: "1980-09-17"
  lugar: "Asunción, Paraguay"
  edad: 54
  final: asesinado
  sello: "Emboscado en el exilio"
  resumen: "El último de la dinastía Somoza huyó de Nicaragua en 1979 y murió un año después en Asunción, cuando un comando atacó su Mercedes blindado."
  episodios: [asi-murieron-los-dictadores-america-latina, asi-murieron-los-hijos-de-los-dictadores]
  cuerpo: |
    ## Una dinastía de 43 años

    La familia Somoza gobernó Nicaragua durante 43 años con tres dictadores de la misma sangre. Todo empezó con Anastasio Somoza García, jefe de la Guardia Nacional, que tomó el poder en 1936. Tras su asesinato en 1956 gobernó su hijo mayor, Luis. El último fue el hermano menor, Anastasio Somoza Debayle.

    Bajo su mando la familia acumuló una fortuna de cientos de millones de dólares. Tras el terremoto que destruyó Managua en 1972 y mató a más de diez mil personas, buena parte de la ayuda internacional terminó en negocios de la familia.

    ## La caída

    En julio de 1979 el Frente Sandinista entró triunfante a Managua. Somoza huyó primero a Estados Unidos, que ya no quiso darle refugio, y terminó en Paraguay bajo la protección de Alfredo Stroessner.

    ## La mañana del 17 de septiembre de 1980

    En Asunción, Somoza salía casi a diario en un Mercedes-Benz blindado. Desde semanas atrás, un comando del Ejército Revolucionario del Pueblo, una guerrilla argentina, estudiaba su ruta y sus horarios.

    Cuando el auto pasó frente a ellos, dispararon un lanzagranadas RPG-7. El blindaje no resistió la explosión. Somoza murió en el acto junto a su chofer y su asesor financiero. Tenía 54 años y había muerto en el único lugar donde se creía a salvo.

- slug: augusto-pinochet
  nombre: Augusto Pinochet
  pais: Chile
  poder: "1973–1990"
  anios_poder: 17
  muerte: "2006-12-10"
  lugar: "Hospital Militar, Santiago de Chile"
  edad: 91
  final: cama
  sello: "Murió sin condena"
  resumen: "Encabezó el golpe de 1973 y gobernó Chile 17 años. Fue arrestado en Londres en 1998, pero murió en 2006 sin una sentencia definitiva."
  episodios: [asi-murieron-los-dictadores-america-latina, como-murieron-los-dictadores-2026]
  cuerpo: |
    ## El poder

    El 11 de septiembre de 1973, Augusto Pinochet encabezó el golpe militar que derrocó al presidente Salvador Allende. Gobernó Chile durante 17 años. Las comisiones oficiales de verdad documentaron más de 3.000 personas asesinadas o desaparecidas y decenas de miles de víctimas de prisión política y tortura. El régimen también impuso reformas económicas que todavía hoy se debaten.

    Al dejar la presidencia en 1990 se aseguró protección: siguió como comandante en jefe del Ejército y luego fue senador vitalicio, un cargo con inmunidad.

    ## Londres, octubre de 1998

    Pinochet, de 82 años, estaba en una clínica de Londres para un tratamiento médico. Las autoridades británicas llegaron con una orden de arresto internacional por secuestro, tortura y desapariciones. El hombre que parecía intocable pasó más de un año detenido en el Reino Unido. Finalmente regresó a Chile por razones de salud.

    De vuelta en su país enfrentó cientos de querellas. En 2004 salieron a la luz sus cuentas secretas millonarias en el Banco Riggs, que rompieron su imagen de militar austero.

    ## El final

    Murió el 10 de diciembre de 2006, a los 91 años, en el Hospital Militar de Santiago. No tuvo funeral de Estado. Su cuerpo fue cremado para evitar que su tumba se convirtiera en un lugar de disputa. Nunca escuchó una sentencia definitiva.

- slug: jorge-rafael-videla
  nombre: Jorge Rafael Videla
  pais: Argentina
  poder: "1976–1981"
  anios_poder: 5
  muerte: "2013-05-17"
  lugar: "Cárcel de Marcos Paz, Argentina"
  edad: 87
  final: preso
  sello: "Murió en prisión"
  resumen: "Encabezó la dictadura más sangrienta de Argentina. Fue condenado, indultado y vuelto a condenar. Murió en su celda en 2013."
  episodios: [asi-murieron-los-dictadores-america-latina, como-murieron-los-dictadores-2026]
  cuerpo: |
    ## El poder

    Jorge Rafael Videla encabezó el golpe militar de marzo de 1976 contra el gobierno de María Estela Martínez de Perón. Desde el primer día, el régimen gobernó con el terror: secuestros en plena noche, centros clandestinos de detención, tortura y el robo sistemático de bebés nacidos en cautiverio. La CONADEP documentó casi 9.000 desapariciones; los organismos de derechos humanos estiman 30.000.

    ## Condenado, indultado, condenado otra vez

    Con el regreso de la democracia, Videla fue condenado a cadena perpetua en el Juicio a las Juntas de 1985. En 1990 el presidente Carlos Menem lo indultó y quedó libre. Muchos pensaron que la historia terminaba ahí.

    No fue así. Los indultos fueron anulados, los procesos se reabrieron y Videla volvió a prisión. En 2010 recibió una nueva condena por crímenes de lesa humanidad y en 2012 otra por el robo de bebés.

    ## El final

    El 17 de mayo de 2013 fue encontrado sin vida en su celda de la cárcel de Marcos Paz. Tenía 87 años. No hubo funeral de Estado ni honores militares. Murió solo, lejos del poder y con varias condenas sobre sus hombros.

- slug: alfredo-stroessner
  nombre: Alfredo Stroessner
  pais: Paraguay
  poder: "1954–1989"
  anios_poder: 35
  muerte: "2006-08-16"
  lugar: "Brasilia, Brasil"
  edad: 93
  final: exilio
  sello: "Murió en el exilio"
  resumen: "La dictadura más larga de Sudamérica en el siglo XX. Lo derrocó su propio consuegro y murió en Brasil sin volver jamás a Paraguay."
  episodios: [asi-murieron-los-dictadores-america-latina]
  cuerpo: |
    ## El poder

    Alfredo Stroessner gobernó Paraguay durante 35 años, de 1954 a 1989. Fue la dictadura más larga de Sudamérica en el siglo XX. Mantuvo una fachada legal con elecciones amañadas, mientras la policía política perseguía a opositores. Paraguay fue una pieza central del Plan Cóndor, la coordinación represiva de las dictaduras del Cono Sur, y sirvió de refugio a criminales nazis y a dictadores caídos como Somoza.

    En 1992, tres años después de su caída, apareció el llamado Archivo del Terror: toneladas de documentos de la policía política que probaron la represión.

    ## La caída

    En febrero de 1989 lo derrocó un golpe encabezado por el general Andrés Rodríguez, su propio consuegro. No hubo resistencia. Stroessner partió al exilio en Brasil.

    ## El final

    Vivió 17 años en Brasilia. Paraguay nunca logró juzgarlo. Murió el 16 de agosto de 2006, a los 93 años, y fue enterrado en Brasil. Ni siquiera muerto volvió a su país.

- slug: hugo-banzer
  nombre: Hugo Banzer Suárez
  pais: Bolivia
  poder: "1971–1978 y 1997–2001"
  anios_poder: 11
  muerte: "2002-05-05"
  lugar: "Santa Cruz de la Sierra, Bolivia"
  edad: 75
  final: cama
  sello: "Despedido con honores"
  resumen: "Llegó al poder con un golpe en 1971, volvió como presidente electo en 1997 y murió con funeral de Estado, sin haber sido juzgado."
  episodios: [asi-murieron-los-dictadores-america-latina]
  cuerpo: |
    ## El dictador

    En agosto de 1971, el coronel Hugo Banzer dio un golpe de Estado en Bolivia. Durante siete años disolvió partidos, persiguió a sindicalistas y estudiantes, y su gobierno participó en el Plan Cóndor. En 1978, ante la presión interna, dejó el poder sin ser derrocado.

    ## El demócrata

    En las décadas siguientes reconstruyó su imagen. Fundó un partido, Acción Democrática Nacionalista, se presentó a varias elecciones y en 1997 ganó la presidencia por la vía democrática. Volvió al Palacio Quemado con traje, no con uniforme. En 2001 renunció por un cáncer.

    ## El final

    Murió el 5 de mayo de 2002 en Santa Cruz de la Sierra, a los 75 años. Recibió funeral de Estado y homenajes oficiales. Nunca fue juzgado por los crímenes de su dictadura. Su caso es el del dictador que se reinventó y fue despedido como estadista.

- slug: alberto-fujimori
  nombre: Alberto Fujimori
  pais: Perú
  poder: "1990–2000"
  anios_poder: 10
  muerte: "2024-09-11"
  lugar: "Lima, Perú"
  edad: 86
  final: cama
  sello: "Condenado, murió libre"
  resumen: "Elegido en 1990, disolvió el Congreso en 1992 y gobernó por decreto. Fue condenado a 25 años de prisión y murió en libertad en 2024."
  episodios: [asi-murieron-los-dictadores-america-latina, como-murieron-los-dictadores-2026]
  cuerpo: |
    ## Del voto al autogolpe

    Alberto Fujimori llegó a la presidencia del Perú en 1990 como un desconocido. El país vivía una inflación devastadora y el terrorismo de Sendero Luminoso. La noche del 5 de abril de 1992, con el respaldo de las Fuerzas Armadas, disolvió el Congreso, intervino el Poder Judicial y empezó a gobernar por decreto.

    Bajo su gobierno se denunciaron ejecuciones extrajudiciales, como las de Barrios Altos y La Cantuta, desapariciones, espionaje político y esterilizaciones forzadas de miles de mujeres, en su mayoría indígenas.

    ## Los vladivideos y la renuncia por fax

    En el año 2000 se difundieron videos en los que su asesor Vladimiro Montesinos entregaba dinero a políticos, empresarios y dueños de medios. El régimen se derrumbó en semanas. Fujimori viajó a Japón y renunció por fax.

    ## La justicia y el final

    En 2005 viajó a Chile, donde fue detenido y extraditado. En 2009 fue condenado a 25 años de prisión. Recibió un indulto en 2017, anulado y luego restituido, y salió en libertad en diciembre de 2023. Murió en Lima el 11 de septiembre de 2024, a los 86 años, con un país todavía dividido sobre su legado.

- slug: fidel-castro
  nombre: Fidel Castro
  pais: Cuba
  poder: "1959–2008"
  anios_poder: 49
  muerte: "2016-11-25"
  lugar: "La Habana, Cuba"
  edad: 90
  final: cama
  sello: "Murió dueño del relato"
  resumen: "Gobernó Cuba casi medio siglo, cedió el poder a su hermano Raúl y murió a los 90 años sin comparecer jamás ante un tribunal."
  episodios: [asi-murieron-los-dictadores-america-latina, como-murieron-los-dictadores-2026]
  cuerpo: |
    ## El poder

    Desde el triunfo de la Revolución en 1959, Fidel Castro fue la figura que dominó la política cubana. Sobrevivió a invasiones, atentados, al embargo de Estados Unidos y a once presidentes estadounidenses. Para sus seguidores fue un símbolo de resistencia. Para sus críticos, el responsable de un régimen de partido único que restringió libertades y empujó al exilio a cientos de miles de cubanos.

    En 2006, enfermo, cedió el poder a su hermano Raúl, de forma definitiva en 2008. Retirado, siguió siendo la figura alrededor de la que giraba el sistema.

    ## Noviembre de 2016

    Murió el 25 de noviembre de 2016 en La Habana, a los 90 años. Cuba decretó nueve días de luto oficial. En Miami, miles de exiliados salieron a celebrar. Nunca se publicó un parte médico detallado.

    No hubo cuerpo expuesto al público. Sus cenizas recorrieron la isla hasta el cementerio de Santa Ifigenia, en Santiago de Cuba, en una despedida controlada por el Estado hasta el último detalle.
